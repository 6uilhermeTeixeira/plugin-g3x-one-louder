name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Configure Release
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build/windows --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $bundle = "build/windows/G3XOneLouder_artefacts/Release/VST3/G3X One Louder.vst3"
          if (-not (Test-Path $bundle)) { throw "G3X One Louder VST3 not found" }
          $binary = Get-ChildItem $bundle -Recurse -File | Where-Object Extension -eq ".vst3" | Select-Object -First 1
          if ($null -eq $binary) { $binary = Get-ChildItem $bundle -Recurse -File | Select-Object -First 1 }
          $hash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($binary.Name)" | Set-Content "build/windows/G3XOneLouder_artefacts/Release/SHA256SUMS.txt"
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: G3X-One-Louder-Windows-x64-${{ github.sha }}
          path: |
            build/windows/G3XOneLouder_artefacts/Release/VST3/G3X One Louder.vst3
            build/windows/G3XOneLouder_artefacts/Release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
